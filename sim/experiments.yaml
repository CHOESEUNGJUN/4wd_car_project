# 시뮬레이션 실험 설정. 값을 목록 [a, b] 으로 쓰면 모든 조합을 돌린다.
# 실행 : python sim/run.py corner   /   python sim/run.py start   /   python sim/run.py --calibrate

# 모든 실험에 쓰는 기본값 (model.py Params 를 덮어씀). --calibrate 로 찾은 값을 여기에 적는다
base:
  mu: 0.5            # 나무합판 + 단단한 고무
  battery_v: 7.0     # 니켈수소 5개 충전 직후
  drop0: 1.0         # L298N 손실 = drop0 + drop_k x 채널 전류 (출발 현상에 맞춘 값)
  drop_k: 0.5
  stiction: 0.018
  bump_cm: 0.2

experiments:
  corner:            # 직진(0.25 m/s) 중 오른쪽 코너 명령을 T 초 동안
    kind: corner
    T: 0.8
    seeds: 10        # 요철 패턴을 바꿔 몇 번 평균
    params:
      mu: [0.4, 0.5]
      battery_v: [7.0, 5.8]
      bump_cm: [0.0, 0.2, 0.3]
    commands:
      out: 220                       # CORNER_OUT
      in: [-170, -130, -110, -90, 0, 90]   # CORNER_IN

  start:             # 정지 상태에서 양쪽 같은 PWM 을 T 초
    kind: start
    T: 0.5
    seeds: 3
    params:
      battery_v: [7.0, 6.4, 5.8]
      shaping: [false, true]         # 출발 킥·최소 힘 없음 / 있음
    commands:
      pwm: [90, 110, 120, 130, 150, 200]

# 차에서 실제로 잰 값 (--calibrate 가 여기에 맞춘다). 재면 채우기
measured:
  start:             # 바닥에서 그 PWM 으로 출발했나 (킥 없이)
    - {battery_v: 7.0, pwm: 130, moves: true}
    - {battery_v: 5.8, pwm: 130, moves: false}
  corner: []         # 예) - {battery_v: 7.0, out: 220, in: -90, yaw_deg: 35}   코너 0.8초 동안 돈 각도

# --calibrate 가 찾아볼 모르는 값 후보
calibrate:
  drop0: [0.6, 1.0, 1.5]
  drop_k: [0.3, 0.5, 0.7]
  stiction: [0.012, 0.015, 0.018]
  mu: [0.4, 0.5, 0.6]
