; ESP32-CAM 을 블루투스 + 와이파이 + 카메라 같이 쓰려고 ESP32 라이브러리를 이 설정으로 다시 빌드한다 (pioarduino).
; Arduino IDE 용 라이브러리는 블루투스·와이파이 메모리를 내부 메모리에만 둬서 셋을 같이 켜면 모자람 (docs/CAMERA.md).
; 빌드·업로드 : cd esp32/esp32cam_line && ~/.pio-venv/bin/pio run -t upload
[platformio]
src_dir = .

[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 9600
build_src_filter = +<*> -<.pio/> -<managed_components/> -<.dummy/>   ; IDF 빌드가 만든 폴더는 빼기
custom_sdkconfig =
  CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST=y
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=512
  CONFIG_BTDM_CTRL_MODE_BTDM=n
  CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=y
  CONFIG_BT_BLE_ENABLED=n
  CONFIG_BLE_MESH=n
  CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
