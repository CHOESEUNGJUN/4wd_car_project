; ESP32-CAM 을 블루투스 + 와이파이 + 카메라 같이 쓰려고 ESP32 라이브러리를 이 설정으로 다시 빌드한다 (pioarduino).
; Arduino IDE 용 라이브러리는 블루투스·와이파이 메모리를 내부 메모리에만 둬서 셋을 같이 켜면 모자람 (docs/CAMERA.md).
; 빌드·업로드 : cd esp32/esp32cam_line && ~/.pio-venv/bin/pio run -t upload
[platformio]
src_dir = .

[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 9600
build_src_filter = +<*> -<.pio/> -<managed_components/> -<.dummy/>   ; IDF 빌드가 만든 폴더는 빼기
; 2026-11-18 : 블루투스를 켜면 내부 메모리가 9~20KB 만 남아 화면이 끊기고 재시작 -> 안 쓰는 것을 빼서 되찾음
; 안 쓰는 블루투스 오디오 (A2DP 음악, HFP 통화) 와 BLE 용 GATT. 우리는 SPP (HC-06 시리얼) 만 씀
; 블루투스 작업 스택 8KB 두 개 -> 줄임 (내부 메모리 약 7KB)
; (연결 수를 1개로 줄이는 것은 뺌 : HC-06 을 찾기는 하는데 연결이 안 됐음, 2026-11-18)
; 와이파이가 한꺼번에 잡는 버퍼 수 32 -> 16 (몰릴 때 내부 메모리를 덜 씀)
custom_sdkconfig =
  CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST=y
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=512
  CONFIG_BTDM_CTRL_MODE_BTDM=n
  CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=y
  CONFIG_BT_BLE_ENABLED=n
  CONFIG_BLE_MESH=n
  CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
  CONFIG_BT_A2DP_ENABLE=n
  CONFIG_BT_HFP_ENABLE=n
  CONFIG_BT_GATTS_ENABLE=n
  CONFIG_BT_GATTC_ENABLE=n
  CONFIG_BT_BTC_TASK_STACK_SIZE=5120
  CONFIG_BT_BTU_TASK_STACK_SIZE=4352
  CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=16
  CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=16
